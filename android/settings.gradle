pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File(rootDir, "local.properties")
        if (!propertiesFile.exists()) {
            propertiesFile = new File(rootDir.parentFile, "local.properties")
        }
        if (!propertiesFile.exists()) {
            return null
        }
        properties.load(propertiesFile.newDataInputStream())
        return properties.getProperty('flutter.sdk')
    }

    def flutterSdk = flutterSdkPath()
    assert flutterSdk != null, "flutter.sdk not set in local.properties"
    includeBuild("${flutterSdk}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
    id "com.google.gms.google-services" version "4.3.15" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
    }
}

rootProject.name = 'android'
include ':app'
